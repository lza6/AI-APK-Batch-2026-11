<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIChat 协议网关</title>
<style>
  :root{--bg:#0f1117;--card:#171a23;--line:#252a37;--fg:#d7dce6;--mute:#7c8698;--acc:#5b9cf5;--ok:#3fb950;--warn:#d29922}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  .tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  .tag.ok{color:var(--ok);border-color:#204a2c}
  .tag.warn{color:var(--warn);border-color:#4a3c18}
  main{max-width:920px;margin:0 auto;padding:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  #log{height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .msg{max-width:82%;padding:9px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:#1e2a3d;border:1px solid #27405f}
  .ai{align-self:flex-start;background:#1b1e27;border:1px solid var(--line)}
  .meta{font-size:11px;color:var(--mute);margin-top:4px}
  form{display:flex;gap:8px}
  input[type=text]{flex:1;background:#0d1017;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit}
  input[type=text]:focus{outline:none;border-color:var(--acc)}
  button{background:var(--acc);color:#07101f;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mute)}
  .row code{color:#a9b4c6}
</style>
</head>
<body>
<header>
  <h1>AIChat v1.9.1 · 协议网关</h1>
  <span class="tag" id="mode-tag">检测中…</span>
  <span class="tag" id="up-tag">上游…</span>
  <span class="tag">POST /chat_stream · SSE</span>
</header>
<main>
  <div class="panel">
    <div id="log"><div class="msg ai">网关已启动。请求会按客户端真实协议发往 <code>/chat_stream</code>，服务端按 <code>AICHAT_MODE</code> 决定透传上游还是本地 mock。<div class="meta">mock 模式保留完整帧格式：<code>{content, conversation_id, event}</code>，<code>event=end</code> 收尾。</div></div></div>
    <form id="f">
      <input id="q" type="text" placeholder="问点什么…（回车发送）" autocomplete="off">
      <button id="send" type="submit">发送</button>
    </form>
    <div class="row">
      <span>模型 <code id="model">3</code></span>
      <span>首字 <code id="ttfb">-</code></span>
      <span>耗时 <code id="total">-</code></span>
      <span>帧数 <code id="frames">0</code></span>
      <span>会话 <code id="conv">-</code></span>
    </div>
  </div>
</main>
<script>
const log = document.getElementById('log');
const $ = id => document.getElementById(id);
async function refresh() {
  try {
    const h = await (await fetch('/health')).json();
    $('mode-tag').textContent = '模式 ' + h.effective;
    $('mode-tag').className = 'tag ' + (h.effective === 'real' ? 'ok' : 'warn');
    const u = h.upstream_state || {};
    const alive = u.ai_channel_alive;
    $('up-tag').textContent = alive
      ? 'AI 通道可达 ' + (u.ai_probe_latency_ms ?? '?') + 'ms'
      : (u.server_alive ? '网站在线 · AI 通道无输出' : '上游离线');
    $('up-tag').className = 'tag ' + (alive ? 'ok' : 'warn');
  } catch (e) { $('mode-tag').textContent = '网关离线'; }
}
refresh(); setInterval(refresh, 15000);

function bubble(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  $('q').value = ''; $('send').disabled = true;
  bubble('me', q);
  const ai = bubble('ai', '');
  const t0 = performance.now(); let first = null, frames = 0, acc = '';
  try {
    const res = await fetch('/chat_stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
      body: JSON.stringify({ query: q, model: 3, conversation: [] })
    });
    if (!res.ok) { ai.textContent = '错误 HTTP ' + res.status + '：' + await res.text(); return; }
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!frame.startsWith('data: ')) continue;
        frames++;
        if (first === null) first = performance.now() - t0;
        const ev = JSON.parse(frame.slice(6));
        if (ev.event === 'end') { $('conv').textContent = ev.conversation_id || '-'; }
        else { acc += ev.content || ''; ai.textContent = acc; log.scrollTop = log.scrollHeight; }
      }
    }
  } catch (e) {
    ai.textContent = '请求失败：' + e.message;
  } finally {
    $('send').disabled = false;
    $('ttfb').textContent = first === null ? '-' : Math.round(first) + 'ms';
    $('total').textContent = Math.round(performance.now() - t0) + 'ms';
    $('frames').textContent = frames;
    $('q').focus();
  }
});
</script>
</body>
</html>
