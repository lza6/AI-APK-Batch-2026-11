<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now AI / Ask Me Anything 协议网关</title>
<style>
  :root{--bg:#0f1117;--card:#171a23;--line:#252a37;--fg:#d7dce6;--mute:#7c8698;--acc:#8b7bf5;--ok:#3fb950;--warn:#d29922}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600}
  .tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  .tag.ok{color:var(--ok);border-color:#204a2c}
  .tag.warn{color:var(--warn);border-color:#4a3c18}
  main{max-width:920px;margin:0 auto;padding:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  #log{height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .msg{max-width:82%;padding:9px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:#242040;border:1px solid #3a3171}
  .ai{align-self:flex-start;background:#1b1e27;border:1px solid var(--line)}
  .meta{font-size:11px;color:var(--mute);margin-top:4px}
  form{display:flex;gap:8px}
  input[type=text]{flex:1;background:#0d1017;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit}
  input[type=text]:focus{outline:none;border-color:var(--acc)}
  button{background:var(--acc);color:#0b0817;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mute)}
  .row code{color:#a9b4c6}
</style>
</head>
<body>
<header>
  <h1>Ask Me Anything v1.7.0 / nova ai v3.7.2 · 协议网关</h1>
  <span class="tag" id="mode-tag">检测中…</span>
  <span class="tag" id="up-tag">上游…</span>
  <span class="tag">POST /api/v1/pass · NDJSON</span>
</header>
<main>
  <div class="panel">
    <div id="log"><div class="msg ai">两个 APK 共用同一个业务包 <code>com.android.ntduc.chatgpt</code> 与同一套上游。网关保留客户端原始线格式：<code>{"contents":[{role,content}]}</code> 请求，逐行 <code>{"status","content"}</code> 返回。<div class="meta">pass-gpt.nowtechai.com 实测 503；本地 mock 用于验证链路与压测。</div></div></div>
    <form id="f">
      <input id="q" type="text" placeholder="问点什么…（回车发送）" autocomplete="off">
      <button id="send" type="submit">发送</button>
    </form>
    <div class="row">
      <span>首字 <code id="ttfb">-</code></span>
      <span>耗时 <code id="total">-</code></span>
      <span>行数 <code id="lines">0</code></span>
      <span>状态 <code id="st">-</code></span>
    </div>
  </div>
</main>
<script>
const log = document.getElementById('log');
const $ = id => document.getElementById(id);
async function refresh() {
  try {
    const h = await (await fetch('/health')).json();
    const real = h.effective === 'real';
    $('mode-tag').textContent = '模式 ' + h.effective;
    $('mode-tag').className = 'tag ' + (real ? 'ok' : 'warn');
    $('up-tag').textContent = real ? '上游可用' : '上游 ' + (h.upstream_state.status ?? '无响应');
    $('up-tag').className = 'tag ' + (real ? 'ok' : 'warn');
  } catch (e) { $('mode-tag').textContent = '网关离线'; }
}
refresh(); setInterval(refresh, 15000);

function bubble(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  $('q').value = ''; $('send').disabled = true;
  bubble('me', q);
  const ai = bubble('ai', '');
  const t0 = performance.now(); let first = null, lines = 0, acc = '', st = '-';
  try {
    const res = await fetch('/api/v1/pass', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ role: 'user', content: q }] })
    });
    if (!res.ok) { ai.textContent = 'HTTP ' + res.status + '：' + await res.text(); return; }
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const raw = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (!raw) continue;
        lines++; if (first === null) first = performance.now() - t0;
        const ev = JSON.parse(raw);
        st = ev.status || '-';
        if (ev.content) { acc += ev.content; ai.textContent = acc; log.scrollTop = log.scrollHeight; }
      }
    }
  } catch (e) { ai.textContent = '请求失败：' + e.message; }
  finally {
    $('send').disabled = false;
    $('ttfb').textContent = first === null ? '-' : Math.round(first) + 'ms';
    $('total').textContent = Math.round(performance.now() - t0) + 'ms';
    $('lines').textContent = lines; $('st').textContent = st; $('q').focus();
  }
});
</script>
</body>
</html>
